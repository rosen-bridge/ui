logs:
  - type: console
    level: info
  - type: file
    path: ./logs/
    maxSize: 20m
    maxFiles: 14d
    level: info
    format: json
    createSymlink: true
db:
  logging: false
  useSSL: false
healthCheck:
  logging:
    maxErrors: 10
    maxWarns: 10
    duration: 100
  scanner:
    warnDiff: 2
    criticalDiff: 10
  updateInterval: 60
dataAggregator:
  interval: 60
tokenMap:
  onChainTokenMapEnabled: true
  path: config/tokensMap.json
statistics:
  lockedAssetsMetrics:
    interval: 86400
  generalMetrics:
    interval: 86400
  eventCountMetrics:
    interval: 86400
  userEventsMetric:
    interval: 86400
  watcherCountMetrics:
    interval: 86400
  bridgeFeeMetrics:
    interval: 86400
  bridgeAmountMetrics:
    interval: 86400
chains:
  ergo:
    scanInterval: 120
    method: explorer
    explorer:
      connections:
        - url: https://api.ergoplatform.com/
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  cardano:
    active: false
    scanInterval: 30
    koios:
      connections:
        - url: https://api.koios.rest/api/v1/
          timeout: 100
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  bitcoin:
    active: false
    scanInterval: 600
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  bitcoin-runes:
    active: false
    unisatUrl: https://open-api.unisat.io
  doge:
    active: false
    scanInterval: 60
    adapter:
      blockCypher:
        url: https://api.blockcypher.com
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  ethereum:
    active: false
    scanInterval: 60
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  binance:
    active: false
    scanInterval: 10
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  firo:
    active: false
    scanInterval: 60
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
  handshake:
    active: false
    scanInterval: 600
    blockCleanupConfig:
      blockCleanupThresholdDuration: 86400
      blockTrimCountInRound: 500
paths:
  contracts: config/contracts.json
  healthReport: healthReport.json
